<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="578" viewBox="0 0 1000 578" role="img" aria-labelledby="title desc">
<title id="title">Spring-damper step response under different damping ratios</title>
<desc id="desc">Analytic response of a normalized second-order linear system to a unit step target, with natural angular frequency 5 radians per second. The underdamped case overshoots and oscillates, the critically damped case approaches the target without overshoot, and the overdamped case approaches more slowly without overshoot. This is a scalar teaching model, not captured Gesture runtime output.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="44" y="34" font-size="23" font-weight="700" fill="#182338">Same target. Different damping.</text>
<text x="44" y="57" font-size="14" fill="#526176">Illustrative continuous-time model · ωₙ = 5 rad/s · unit step target · normalized response</text>
