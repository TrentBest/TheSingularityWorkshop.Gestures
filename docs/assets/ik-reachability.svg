<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 508" role="img" aria-labelledby="title desc">
  <title id="title">Reachability and constraints for a two-link arm</title>
  <desc id="desc">A fixed anchor, two links, and a highlighted endpoint are shown inside the maximum reach circle. A target beyond the circle is marked unreachable. A joint-limit wedge illustrates that mechanical constraints can reduce the reachable region further.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b30"/><stop offset="1" stop-color="#1b2b3a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="900" height="470" rx="20" fill="url(#bg)"/>
  <text x="38" y="42" fill="#f4f8ff" font-family="system-ui,sans-serif" font-size="23" font-weight="700">REACH IS NOT GUARANTEED</text>
  <text x="38" y="66" fill="#a8c1d4" font-family="system-ui,sans-serif" font-size="14">Geometry sets one boundary; joint limits can tighten it.</text>
  <g transform="translate(290 270)">
    <circle r="195" fill="#55d9f5" fill-opacity=".04" stroke="#55d9f5" stroke-width="2" stroke-dasharray="7 7"/>
    <circle r="35" fill="none" stroke="#55d9f5" stroke-opacity=".3" stroke-dasharray="4 5"/>
    <path d="M0 0 L170 -96" stroke="#ffcc66" stroke-width="22" stroke-linecap="round"/>
    <path d="M0 0 L170 -96" stroke="#fff0c9" stroke-width="13" stroke-linecap="round"/>
    <circle cx="170" cy="-96" r="10" fill="#ffcc66"/>
    <path d="M170 -96 L270 -40" stroke="#2d7e9a" stroke-width="22" stroke-linecap="round"/>
    <path d="M170 -96 L270 -40" stroke="#a5f3fc" stroke-width="13" stroke-linecap="round"/>
    <circle cx="270" cy="-40" r="10" fill="#f4f8ff" stroke="#55d9f5" stroke-width="4"/>
    <circle cx="270" cy="-40" r="19" fill="none" stroke="#55d9f5" stroke-width="2">
      <animate attributeName="r" values="15;25;15" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#f4f8ff"/>
    <path d="M0 0 L90 0 A90 90 0 0 0 78 -45 Z" fill="#a78bfa" fill-opacity=".22" stroke="#a78bfa" stroke-width="2"/>
    <text x="13" y="28" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="13">joint range</text>
    <text x="10" y="-208" fill="#8eeaff" font-family="system-ui,sans-serif" font-size="14">maximum reach envelope</text>
  </g>
  <g transform="translate(720 235)">
    <circle r="27" fill="#ff6b7a" fill-opacity=".12" stroke="#ff6b7a" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M-9 -9L9 9M9 -9L-9 9" stroke="#ff6b7a" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="-49" fill="#ff9ca6" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700">OUT OF REACH</text>
    <text x="0" y="48" fill="#d3dfec" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13">no exact pose</text>
    <path d="M-38 0 H-180" stroke="#ff6b7a" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <g transform="translate(545 360)">
    <rect width="310" height="65" rx="10" fill="#22364a" stroke="#526b82"/>
    <circle cx="22" cy="22" r="5" fill="#55d9f5"/><text x="36" y="27" fill="#f4f8ff" font-family="system-ui,sans-serif" font-size="13">reachable geometry</text>
    <circle cx="22" cy="44" r="5" fill="#a78bfa"/><text x="36" y="49" fill="#f4f8ff" font-family="system-ui,sans-serif" font-size="13">legal joint angles may be narrower</text>
  </g>
  <text x="38" y="438" fill="#9db4c9" font-family="system-ui,sans-serif" font-size="12">Illustrative geometry · dimensions are not to scale</text>

<g id="provenance-label" role="group" aria-label="CONCEPTUAL REACHABILITY MODEL • TECHNOLOGY: NATIVE SVG • WORKSHOP RUNTIME: NOT USED • GUI.SVG: NOT USED">
  <rect x="12" y="473" width="876" height="27" rx="6" fill="#172033"/>
  <text x="450" y="491" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#ffffff">CONCEPTUAL REACHABILITY MODEL • TECHNOLOGY: NATIVE SVG • WORKSHOP RUNTIME: NOT USED • GUI.SVG: NOT USED</text>
</g>
</svg>