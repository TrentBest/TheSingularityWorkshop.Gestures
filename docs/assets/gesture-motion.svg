<!--
  Conceptual illustration of the current reference evaluator.
  The moving marker illustrates keyframe interpolation only; it is not a physics simulation.
  The spring-damper equation is an explicitly exploratory future model.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Gesture motion: keyframes, evaluated pose, and equation exploration</title>
  <desc id="desc">An animated marker travels between three pose keyframes on a simple path. The current CPU evaluator interpolates transforms. A separate panel shows the exploratory mass-spring-damper equation, not yet implemented.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#17283b"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b84b" stop-opacity=".25"/>
      <stop offset="1" stop-color="#75d6ff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="420" rx="18" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#f3f6fb">
    <text x="34" y="40" font-size="12" letter-spacing="2.2" fill="#8da7c5">GESTURES / REFERENCE MODEL</text>
    <text x="34" y="72" font-size="25" font-weight="700">A procedure is a path through poses</text>
    <text x="34" y="96" font-size="13" fill="#b9c8d9">Keyframes define intent · the evaluator produces a pose at a requested time</text>
  </g>
  <g>
    <path d="M88 202 C210 202 270 145 392 145 S570 235 690 235 S790 196 872 196" fill="none" stroke="#334b65" stroke-width="2" stroke-dasharray="5 8"/>
    <path d="M88 202 C210 202 270 145 392 145 S570 235 690 235 S790 196 872 196" fill="none" stroke="url(#trail)" stroke-width="3"/>
    <g fill="#e8b84b" stroke="#fff0b9" stroke-width="2">
      <circle cx="88" cy="202" r="8"/><circle cx="392" cy="145" r="8"/><circle cx="690" cy="235" r="8"/>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dbe7f5">
      <text x="66" y="228">t = 0</text><text x="370" y="124">t = 0.5</text><text x="667" y="261">t = 1</text>
      <text x="66" y="183" fill="#e8b84b">POSE A</text><text x="370" y="105" fill="#e8b84b">POSE B</text><text x="667" y="216" fill="#e8b84b">POSE C</text>
    </g>
    <g filter="url(#glow)">
      <circle r="11" fill="#78dcff" stroke="#e4f9ff" stroke-width="2">
        <animateMotion dur="5s" repeatCount="indefinite" path="M88 202 C210 202 270 145 392 145 S570 235 690 235 S790 196 872 196"/>
      </circle>
    </g>
    <path d="M88 290 H872" stroke="#3d536c" stroke-width="1"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#b9c8d9">
      <text x="88" y="312">normalized progress 0</text><text x="480" y="312" text-anchor="middle">evaluated pose</text><text x="872" y="312" text-anchor="end">normalized progress 1</text>
    </g>
  </g>
  <g>
    <rect x="28" y="334" width="904" height="62" rx="10" fill="#0b1421" stroke="#344d67"/>
    <text x="46" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#78dcff">IMPLEMENTED BASELINE</text>
    <text x="46" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f3f6fb">Position / scale: linear interpolation  ·  Rotation: quaternion slerp</text>
    <text x="914" y="356" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#e8b84b">EXPLORATION</text>
    <text x="914" y="378" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#f3f6fb">mẍ = Fdrive − cẋ − k(x − xtarget)</text>
  </g>
</svg>
