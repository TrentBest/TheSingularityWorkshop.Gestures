    <path d="M785 344 V190 H837 V154 H877 V344 Z" fill="#354a60"/>
    <path d="M888 344 V220 H947 V175 H1002 V344 Z" fill="#25394d"/>
    <path d="M1012 344 V155 H1090 V344 Z" fill="#30465a"/>
    <path d="M425 214 H478 V172 H518 V344 H425 Z" fill="url(#windows)" opacity=".85"/>
    <path d="M512 146 H590 V344 H512 Z" fill="url(#windows)"/>
    <path d="M594 205 H650 V164 H691 V344 H594 Z" fill="url(#windows)"/>
    <path d="M700 130 H778 V344 H700 Z" fill="url(#windows)"/>
    <path d="M785 190 H837 V154 H877 V344 H785 Z" fill="url(#windows)"/>
    <path d="M888 220 H947 V175 H1002 V344 H888 Z" fill="url(#windows)"/>
    <path d="M1012 155 H1090 V344 H1012 Z" fill="url(#windows)"/>
  </g>
  <g fill="#a7c4d0" opacity=".75">
    <use href="#tiny" x="445" y="333"/><use href="#tiny" x="463" y="333"/><use href="#tiny" x="481" y="333"/><use href="#tiny" x="499" y="333"/>
    <use href="#tiny" x="530" y="333"/><use href="#tiny" x="548" y="333"/><use href="#tiny" x="566" y="333"/><use href="#tiny" x="584" y="333"/>
    <use href="#tiny" x="612" y="333"/><use href="#tiny" x="630" y="333"/><use href="#tiny" x="648" y="333"/><use href="#tiny" x="666" y="333"/>
    <use href="#tiny" x="716" y="333"/><use href="#tiny" x="734" y="333"/><use href="#tiny" x="752" y="333"/><use href="#tiny" x="770" y="333"/>
    <use href="#tiny" x="803" y="333"/><use href="#tiny" x="821" y="333"/><use href="#tiny" x="839" y="333"/><use href="#tiny" x="857" y="333"/>
    <use href="#tiny" x="906" y="333"/><use href="#tiny" x="924" y="333"/><use href="#tiny" x="942" y="333"/><use href="#tiny" x="960" y="333"/>
    <use href="#tiny" x="1030" y="333"/><use href="#tiny" x="1048" y="333"/><use href="#tiny" x="1066" y="333"/><use href="#tiny" x="1084" y="333"/>
  </g>
  <g id="room-panel">
    <path d="M48 112 H385 V386 H48 Z" fill="url(#room)" stroke="#b7a17b" stroke-width="2"/>
    <path d="M72 137 H360 V358 H72 Z" fill="none" stroke="#c3aa7a" stroke-width="2"/>
    <path d="M91 154 H340 V341 H91 Z" fill="#1c2635" stroke="#8b795f"/>
    <path d="M110 166 H321 V329 H110 Z" fill="#30404d"/>
    <path d="M122 178 H309 V317 H122 Z" fill="#3d4b55"/>
    <path d="M135 191 H296 V304 H135 Z" fill="#202c3b"/>
    <path d="M48 386 H385" stroke="#d4b67a" stroke-width="5"/>
    <path d="M58 113 L85 89 H348 L374 113" fill="#7d6b56" stroke="#c7b18a" stroke-width="2"/>
    <rect x="64" y="127" width="30" height="239" fill="#a58b65" opacity=".5"/>
    <rect x="340" y="127" width="30" height="239" fill="#a58b65" opacity=".5"/>
    <g transform="translate(246 275) scale(1.45)"><use href="#soldier"/></g>
    <path d="M239 267 L225 248 L211 250" fill="none" stroke="#f8d26a" stroke-width="4" stroke-linecap="round"/>
    <text x="64" y="413" fill="#f3d99b" font-family="Arial,sans-serif" font-size="13" font-weight="700">01 · PRIVATE ROOM</text>
    <text x="64" y="432" fill="#d2dce7" font-family="Arial,sans-serif" font-size="11">Advisor salutes; audience already audible</text>
  </g>
  <g id="balcony-panel">
    <path d="M392 112 H1160 V386 H392 Z" fill="none" stroke="#80b8c6" stroke-width="2"/>
    <path d="M394 344 H1160 M394 365 H1160" stroke="#9ab6c7" stroke-width="3"/>
    <path d="M400 344 V385 M470 344 V385 M540 344 V385 M610 344 V385 M680 344 V385 M750 344 V385 M820 344 V385 M890 344 V385 M960 344 V385 M1030 344 V385 M1100 344 V385 M1160 344 V385" stroke="#9ab6c7" stroke-width="3"/>
