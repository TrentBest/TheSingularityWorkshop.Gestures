<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Speech scene and event-horizon soldier population</title>
  <desc id="desc">Conceptual animated storyboard: the advisor and player move from a decorated room onto a balcony overlooking soldiers across a city. Crowd response propagates by cluster, and distant soldiers use aggregated representations rather than full individual rigs.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111b35"/><stop offset="1" stop-color="#283d56"/></linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#584b42"/><stop offset="1" stop-color="#242e3d"/></linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58d7c9" stop-opacity=".9"/><stop offset="1" stop-color="#f8d26a" stop-opacity=".15"/></linearGradient>
    <pattern id="windows" width="24" height="26" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="9" height="13" rx="1" fill="#ffd78b" opacity=".72"/></pattern>
    <g id="soldier"><circle cx="0" cy="-10" r="4" fill="#d5e3e7"/><path d="M-5 -5 L5 -5 L7 8 L-7 8 Z" fill="#6c9eaa" stroke="#d5e3e7" stroke-width="1"/><path d="M-4 8 L-5 15 M4 8 L5 15 M-5 -2 L-10 4 M5 -2 L10 4" stroke="#d5e3e7" stroke-width="2" stroke-linecap="round"/></g>
    <g id="tiny"><circle cy="-3" r="1.5" fill="#c8e5e8"/><path d="M-2 -1 L2 -1 L3 5 L-3 5 Z" fill="#5fa7b1"/></g>
  </defs>
  <rect width="1200" height="680" rx="18" fill="#0b1221"/>
  <text x="34" y="40" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="23" font-weight="700">THE SPEECH SCENE</text>
  <text x="34" y="64" fill="#9db3c8" font-family="Arial,sans-serif" font-size="13">CONCEPTUAL DESIGN MAP · NOT YET RUNTIME-GENERATED EVIDENCE</text>
  <rect x="28" y="88" width="1144" height="365" rx="12" fill="url(#sky)" stroke="#43556e"/>
  <path d="M28 344 L1172 344 L1172 453 L28 453 Z" fill="#111b2c"/>
  <g opacity=".9">
    <path d="M425 344 V214 H478 V172 H518 V344 Z" fill="#354b60"/>
    <path d="M512 344 V146 H590 V344 Z" fill="#263e54"/>
    <path d="M594 344 V205 H650 V164 H691 V344 Z" fill="#344d61"/>
