    <g transform="translate(440 309) scale(1.5)"><use href="#soldier"/></g>
    <g transform="translate(405 263) scale(1.2)"><use href="#soldier"/></g>
    <g transform="translate(432 266) scale(1.2)"><use href="#soldier"/></g>
    <rect x="1000" y="241" width="94" height="57" rx="3" fill="#172536" stroke="#d7e9ef" stroke-width="2"/>
    <rect x="1006" y="247" width="82" height="45" fill="#4b9eaa"/>
    <g transform="translate(1048 274) scale(.9)"><use href="#soldier"/></g>
    <path d="M1048 267 L1060 254" stroke="#f8d26a" stroke-width="3" stroke-linecap="round"/>
    <text x="410" y="413" fill="#9be5dc" font-family="Arial,sans-serif" font-size="13" font-weight="700">02 · BALCONY REVEAL</text>
    <text x="410" y="432" fill="#d2dce7" font-family="Arial,sans-serif" font-size="11">Crowd occupies architecture; screens echo the player</text>
  </g>
  <g id="recognition-wave" fill="none" stroke="url(#wave)" stroke-width="3">
    <path d="M444 290 Q500 235 556 290"><animate attributeName="opacity" values=".15;.95;.15" dur="3.6s" repeatCount="indefinite"/></path>
    <path d="M590 282 Q665 195 740 282"><animate attributeName="opacity" values=".1;.85;.1" dur="3.6s" begin=".7s" repeatCount="indefinite"/></path>
    <path d="M770 280 Q862 165 954 280"><animate attributeName="opacity" values=".1;.8;.1" dur="3.6s" begin="1.4s" repeatCount="indefinite"/></path>
    <path d="M940 282 Q1032 184 1124 282"><animate attributeName="opacity" values=".1;.9;.1" dur="3.6s" begin="2.1s" repeatCount="indefinite"/></path>
  </g>
  <g transform="translate(40 477)">
    <rect width="1120" height="164" rx="10" fill="#111d30" stroke="#344c67"/>
    <text x="22" y="28" fill="#f4f4ef" font-family="Arial,sans-serif" font-size="15" font-weight="700">EVENT-HORIZON REPRESENTATION · SAME SOLDIER IDENTITY, DIFFERENT DETAIL BUDGET</text>
    <g transform="translate(65 86)"><use href="#soldier" transform="scale(1.6)"/><text x="-28" y="38" fill="#dbe6ee" font-family="Arial,sans-serif" font-size="12">Interaction</text><text x="-28" y="54" fill="#91b7c8" font-family="Arial,sans-serif" font-size="10">full pose / contact</text></g>
    <path d="M135 86 H225" stroke="#607f99" stroke-width="2" stroke-dasharray="4 5"/><path d="M215 79 L226 86 L215 93" fill="none" stroke="#607f99" stroke-width="2"/>
    <g transform="translate(270 86)"><use href="#soldier" transform="scale(1.25)"/><use href="#soldier" x="22" transform="scale(1.25)"/><use href="#soldier" x="44" transform="scale(1.25)"/><text x="-25" y="38" fill="#dbe6ee" font-family="Arial,sans-serif" font-size="12">Near crowd</text><text x="-25" y="54" fill="#91b7c8" font-family="Arial,sans-serif" font-size="10">stable variations</text></g>
    <path d="M370 86 H450" stroke="#607f99" stroke-width="2" stroke-dasharray="4 5"/><path d="M440 79 L451 86 L440 93" fill="none" stroke="#607f99" stroke-width="2"/>
    <g transform="translate(495 86)"><use href="#tiny" x="0"/><use href="#tiny" x="14"/><use href="#tiny" x="28"/><use href="#tiny" x="42"/><use href="#tiny" x="56"/><use href="#tiny" x="70"/><use href="#tiny" x="84"/><use href="#tiny" x="98"/><use href="#tiny" x="112"/><use href="#tiny" x="126"/><text x="-24" y="38" fill="#dbe6ee" font-family="Arial,sans-serif" font-size="12">Middle distance</text><text x="-24" y="54" fill="#91b7c8" font-family="Arial,sans-serif" font-size="10">instances / fewer channels</text></g>
    <path d="M665 86 H745" stroke="#607f99" stroke-width="2" stroke-dasharray="4 5"/><path d="M735 79 L746 86 L735 93" fill="none" stroke="#607f99" stroke-width="2"/>
    <g transform="translate(790 86)"><rect x="0" y="-20" width="105" height="38" rx="4" fill="#29445b" stroke="#7194ad"/><path d="M8 -12 H97 M8 -4 H97 M8 4 H97 M8 12 H97" stroke="#a9d7dd" stroke-width="2" stroke-dasharray="3 5"/><text x="-4" y="38" fill="#dbe6ee" font-family="Arial,sans-serif" font-size="12">Far city</text><text x="-4" y="54" fill="#91b7c8" font-family="Arial,sans-serif" font-size="10">cluster phase / density</text></g>
    <g transform="translate(1010 84)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#f8d26a" stroke-width="2" stroke-dasharray="4 4"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
      <path d="M-17 0 H17 M0 -17 V17" stroke="#f8d26a" stroke-width="2"/>
      <text x="-39" y="40" fill="#dbe6ee" font-family="Arial,sans-serif" font-size="12">Beyond detail</text><text x="-39" y="56" fill="#91b7c8" font-family="Arial,sans-serif" font-size="10">city-scale summary</text>
    </g>
    <text x="22" y="147" fill="#f8d26a" font-family="Arial,sans-serif" font-size="11">Design intent only: tiers and crowd wave are conceptual, not a measured runtime implementation.</text>
  </g>
</svg>