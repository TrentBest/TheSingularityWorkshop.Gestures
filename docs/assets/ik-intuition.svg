<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Inverse kinematics intuition: reach the goal by changing joint angles</title>
  <desc id="desc">An animated two-link arm with a fixed shoulder, elbow hinge, endpoint, and a highlighted target. The arm rotates through example poses. This is an illustrative animation, not output from the IK solver.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#172b3c"/></linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d9f5"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="460" rx="20" fill="url(#bg)"/>
  <g stroke="#7891a9" stroke-opacity=".16" stroke-width="1">
    <path d="M70 70H830M70 130H830M70 190H830M70 250H830M70 310H830M70 370H830"/>
    <path d="M130 50V410M190 50V410M250 50V410M310 50V410M370 50V410M430 50V410M490 50V410M550 50V410M610 50V410M670 50V410M730 50V410M790 50V410"/>
  </g>
  <text x="42" y="42" fill="#f4f8ff" font-family="system-ui,sans-serif" font-size="23" font-weight="700">INVERSE KINEMATICS</text>
  <text x="42" y="66" fill="#a8c1d4" font-family="system-ui,sans-serif" font-size="14">Goal first. Joint angles are the unknowns.</text>
  <circle cx="260" cy="305" r="170" fill="none" stroke="#7891a9" stroke-opacity=".28" stroke-dasharray="5 7"/>
  <path d="M260 305 L430 305" stroke="#7891a9" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 5"/>
  <g transform="translate(260 305)">
    <circle r="17" fill="#122638" stroke="#f4f8ff" stroke-width="3"/>
    <circle r="5" fill="#f4f8ff"/>
    <text x="-4" y="37" fill="#f4f8ff" font-family="system-ui,sans-serif" font-size="15">Anchor</text>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-32;12;42;5;-32" dur="9s" repeatCount="indefinite"/>
      <path d="M0 0H130" stroke="#2d7e9a" stroke-width="23" stroke-linecap="round"/>
      <path d="M0 0H130" stroke="url(#link)" stroke-width="15" stroke-linecap="round"/>
      <circle cx="130" cy="0" r="13" fill="#172b3c" stroke="#f4f8ff" stroke-width="3"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="52;-22;24;70;52" dur="9s" repeatCount="indefinite"/>
        <path d="M130 0H120" stroke="#a5f3fc" stroke-width="3"/>
        <path d="M130 0H245" stroke="#2d7e9a" stroke-width="23" stroke-linecap="round"/>
        <path d="M130 0H245" stroke="url(#link)" stroke-width="15" stroke-linecap="round"/>
        <circle cx="245" cy="0" r="11" fill="#f4f8ff" stroke="#55d9f5" stroke-width="4"/>
        <circle cx="245" cy="0" r="22" fill="none" stroke="#55d9f5" stroke-width="2" opacity=".65" filter="url(#glow)">
          <animate attributeName="r" values="17;29;17" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".25;.9;.25" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
  <g transform="translate(600 190)">
    <circle r="31" fill="#ffcc66" fill-opacity=".12" stroke="#ffcc66" stroke-dasharray="5 5" stroke-width="2"/>
    <circle r="9" fill="#ffcc66" filter="url(#glow)"/>
    <circle r="17" fill="none" stroke="#ffcc66" stroke-width="2" opacity=".7">
      <animate attributeName="r" values="13;26;13" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".8;.1;.8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="-48" text-anchor="middle" fill="#ffdf9a" font-family="system-ui,sans-serif" font-size="17" font-weight="700">GOAL / TARGET</text>
    <text x="0" y="52" text-anchor="middle" fill="#d3dfec" font-family="system-ui,sans-serif" font-size="13">desired position</text>
  </g>
  <path d="M470 340 C510 370 530 365 560 330" fill="none" stroke="#ffcc66" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M550 329l12 -2 -3 12" fill="none" stroke="#ffcc66" stroke-width="2"/>
  <text x="475" y="392" fill="#d3dfec" font-family="system-ui,sans-serif" font-size="15">IK asks: which angles</text>
  <text x="475" y="414" fill="#d3dfec" font-family="system-ui,sans-serif" font-size="15">could move the tip here?</text>
  <rect x="42" y="423" width="816" height="1" fill="#7891a9" fill-opacity=".4"/>
  <text x="42" y="446" fill="#9db4c9" font-family="system-ui,sans-serif" font-size="12">Schematic animation only · not live solver output</text>
</svg>