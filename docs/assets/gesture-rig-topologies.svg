<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rig-neutral overview for TheSingularityWorkshop.Gestures.
  This is a conceptual data-model diagram, not a runtime screenshot or a
  claim that retargeting, IK, collision solving, or animal-specific solvers exist.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One Gesture model, many rig topologies</title>
  <desc id="desc">Three example articulated systems—a humanoid, a quadruped, and an industrial arm—are represented as named local transforms. A generic Gesture definition and CPU reference evaluator produce evaluated transform data for a consumer-specific rig adapter and renderer. The diagram does not imply automatic retargeting or inverse kinematics.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1a2b3d"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b4965"/>
      <stop offset="1" stop-color="#226b76"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#9db4c9"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .heading { fill: #f2f6fb; font-size: 25px; font-weight: 700; }
      .subhead { fill: #c1d0df; font-size: 14px; }
      .card { fill: #142235; stroke: #40556c; stroke-width: 1.5; }
      .cardtitle { fill: #f2f6fb; font-size: 18px; font-weight: 700; }
      .label { fill: #c1d0df; font-size: 12px; }
      .bone { stroke: #81d7ee; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .joint { fill: #e8bd61; stroke: #fff0bd; stroke-width: 1.5; }
      .connector { stroke: #9db4c9; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .smallcaps { fill: #81d7ee; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="22" fill="url(#canvas)"/>
  <text x="40" y="44" class="smallcaps">GESTURES / RIG-NEUTRAL MODEL</text>
  <text x="40" y="82" class="heading">One procedure model. Many articulated worlds.</text>
  <text x="40" y="110" class="subhead">Gesture data names local transforms; the target rig supplies its own topology and domain meaning.</text>

  <!-- Example topology cards -->
  <g transform="translate(35 140)">
    <rect width="350" height="255" rx="14" class="card"/>
    <text x="20" y="32" class="cardtitle">Humanoid</text>
    <text x="20" y="52" class="label">example topology · not a required schema</text>
    <g class="bone">
      <path d="M175 101 L175 151 L175 190"/>
      <path d="M175 124 L132 145 L112 179"/>
      <path d="M175 124 L218 145 L238 179"/>
      <path d="M175 190 L148 221"/>
      <path d="M175 190 L202 221"/>
    </g>
    <g class="joint">
      <circle cx="175" cy="83" r="15"/><circle cx="175" cy="101" r="6"/>
      <circle cx="175" cy="124" r="7"/><circle cx="132" cy="145" r="6"/>
      <circle cx="112" cy="179" r="6"/><circle cx="218" cy="145" r="6"/>
      <circle cx="238" cy="179" r="6"/><circle cx="175" cy="151" r="6"/>
      <circle cx="175" cy="190" r="7"/><circle cx="148" cy="221" r="6"/>
      <circle cx="202" cy="221" r="6"/>
    </g>
    <text x="20" y="242" class="label">head · torso · hands · feet</text>
  </g>

  <g transform="translate(425 140)">
    <rect width="350" height="255" rx="14" class="card"/>
    <text x="20" y="32" class="cardtitle">Quadruped</text>
    <text x="20" y="52" class="label">example topology · animal movement is not human movement</text>
    <g class="bone">
      <path d="M82 133 L157 115 L222 129 L267 110"/>
      <path d="M98 137 L83 184 L65 214"/>
      <path d="M139 124 L146 178 L132 214"/>
      <path d="M211 130 L222 177 L242 213"/>
      <path d="M249 121 L277 164 L292 199"/>
      <path d="M267 110 L292 91"/>
    </g>
    <g class="joint">
      <circle cx="82" cy="133" r="7"/><circle cx="157" cy="115" r="7"/>
      <circle cx="222" cy="129" r="7"/><circle cx="267" cy="110" r="7"/>
      <circle cx="98" cy="137" r="6"/><circle cx="83" cy="184" r="6"/>
      <circle cx="139" cy="124" r="6"/><circle cx="146" cy="178" r="6"/>
      <circle cx="211" cy="130" r="6"/><circle cx="222" cy="177" r="6"/>
      <circle cx="249" cy="121" r="6"/><circle cx="277" cy="164" r="6"/>
    </g>
    <text x="20" y="242" class="label">spine · shoulders · hips · paws · tail</text>
  </g>

  <g transform="translate(815 140)">
    <rect width="350" height="255" rx="14" class="card"/>
    <text x="20" y="32" class="cardtitle">Articulated mechanism</text>
    <text x="20" y="52" class="label">same general idea outside biological rigs</text>
    <g class="bone">
      <path d="M108 215 L108 169 L160 142 L211 100 L264 91"/>
      <path d="M264 91 L285 113 L275 129"/>
    </g>
    <g class="joint">
      <circle cx="108" cy="215" r="11"/><circle cx="108" cy="169" r="9"/>
      <circle cx="160" cy="142" r="9"/><circle cx="211" cy="100" r="9"/>
      <circle cx="264" cy="91" r="9"/><circle cx="285" cy="113" r="7"/>
    </g>
    <path d="M80 228 H139" stroke="#e8bd61" stroke-width="5" stroke-linecap="round"/>
    <text x="20" y="242" class="label">base · joints · links · tool tip</text>
  </g>

  <!-- Common data contract -->
  <path d="M210 395 V422 H600 V444" class="connector"/>
  <path d="M600 395 V444" class="connector"/>
  <path d="M990 395 V422 H600" stroke="#9db4c9" stroke-width="2" fill="none"/>
  <rect x="215" y="445" width="770" height="92" rx="14" fill="url(#data)" stroke="#65b8c9" stroke-width="1.5"/>
  <text x="600" y="474" text-anchor="middle" fill="#f4fbff" font-size="20" font-weight="700">GestureDefinition → CPU reference evaluator</text>
  <text x="600" y="500" text-anchor="middle" fill="#d9f3f7" font-size="14">normalized keyframes · named local transforms · optional semantic anchors · time / seed</text>
  <text x="600" y="521" text-anchor="middle" fill="#d9f3f7" font-size="12">Current baseline: linear position/scale interpolation + quaternion slerp</text>

  <path d="M600 537 V564" class="connector"/>
  <rect x="255" y="570" width="690" height="58" rx="12" fill="#202c40" stroke="#e8bd61" stroke-width="1.5"/>
  <text x="600" y="594" text-anchor="middle" fill="#f4f6fb" font-size="17" font-weight="700">EvaluatedPose → consumer-owned rig adapter → renderer</text>
  <text x="600" y="615" text-anchor="middle" fill="#c1d0df" font-size="12">Mapping / retargeting is not implied; collision, IK, and authoritative motion remain external.</text>
  <text x="40" y="672" fill="#a8bbcf" font-size="12">Conceptual architecture diagram. The example rigs illustrate possible topologies, not a frozen rig schema or captured runtime output.</text>
</svg>
