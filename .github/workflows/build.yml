name: Build, test, and package Gestures

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified package to NuGet.org"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Gestures.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.Gestures.slnx --configuration Release --no-restore

      - name: Generate the living SVG from FSM_API and GestureEvaluator
        run: dotnet run --project tools/living-demo/living-demo.csproj --configuration Release -- --output docs/assets/gesture-motion.svg

      - name: Generate deterministic provider and actor-choice living SVG
        run: dotnet run --project tools/provider-actor-choice-demo/provider-actor-choice-demo.csproj --configuration Release -- --output docs/assets/provider-actor-choice.svg

      - name: Generate deterministic variation scene
        run: dotnet run --project tools/variation-demo/variation-demo.csproj --configuration Release -- --output docs/assets/gesture-variation.svg

      - name: Generate living crowd-response schedule from the CPU scheduler
        run: dotnet run --project tools/crowd-response-demo/crowd-response-demo.csproj --configuration Release --no-build -- --output docs/assets/crowd-response-schedule.svg

      - name: Generate Extremus population SVG from the CPU baker
        run: dotnet run --project tools/extremus-crowd-demo/extremus-crowd-demo.csproj --configuration Release --no-build -- --output docs/assets/extremus-crowd-bake.svg

      - name: Validate documentation SVG XML and visible provenance
        shell: python {0}
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path("docs/assets").rglob("*.svg"))
          if not files:
              raise SystemExit("No documentation SVG assets found.")

          failures = []
          for path in files:
              root = ET.parse(path).getroot()
              labels = [node for node in root.iter() if node.attrib.get("id") == "provenance-label"]
              if not labels:
                  failures.append(f"{path}: missing visible provenance label")
                  continue
              label = " ".join("".join(node.itertext()) for node in labels)
              aria = " ".join(node.attrib.get("aria-label", "") for node in labels)
              combined = f"{label} {aria}"
              if "GUI.SVG: USED" not in combined and "GUI.SVG: NOT USED" not in combined:
                  failures.append(f"{path}: provenance must explicitly say GUI.SVG: USED or GUI.SVG: NOT USED")

          if failures:
              raise SystemExit("\\n".join(failures))
          print(f"Validated XML and explicit GUI.SVG provenance for {len(files)} SVG files under docs/assets.")

      - name: Upload generated living SVGs
        uses: actions/upload-artifact@v7
        with:
          name: gesture-living-svgs
          path: |
            docs/assets/gesture-*.svg
            docs/assets/crowd-response-schedule.svg
            docs/assets/extremus-crowd-bake.svg
            docs/assets/provider-actor-choice.svg
            docs/assets/provider-actor-choice.json

      - name: Require crowd-response SVG snapshot parity
        shell: bash
        run: |
          if ! git diff --quiet -- docs/assets/crowd-response-schedule.svg; then
            echo "::error::The crowd-response SVG snapshot differs from actual scheduler output. Review and synchronize docs/assets/crowd-response-schedule.svg."
            git diff --stat -- docs/assets/crowd-response-schedule.svg
            exit 1
          fi
          echo "The crowd-response SVG snapshot matches actual scheduler output."

      - name: Report remaining generated SVG snapshot drift
        shell: bash
        run: |
          if ! git diff --quiet -- docs/assets/gesture-motion.svg docs/assets/gesture-channels.svg docs/assets/gesture-target-agnostic.svg docs/assets/gesture-variation.svg; then
            echo "::warning::Other generated living SVGs differ from checked-in snapshots. Review the uploaded gesture-living-svgs artifact and synchronize the snapshots before re-enabling their drift gate."
            git diff --stat -- docs/assets/gesture-motion.svg docs/assets/gesture-channels.svg docs/assets/gesture-target-agnostic.svg docs/assets/gesture-variation.svg
          else
            echo "All other generated living SVG snapshots are current."
          fi

      - name: Report Extremus SVG snapshot drift until the generated snapshot is reviewed
        shell: bash
        run: |
          if ! git ls-files --error-unmatch docs/assets/extremus-crowd-bake.svg >/dev/null 2>&1; then
            echo "::warning::The Extremus SVG has been generated but no checked-in snapshot exists yet. Review the uploaded artifact and commit the exact generated output before adding a blocking parity gate."
          elif ! git diff --quiet -- docs/assets/extremus-crowd-bake.svg; then
            echo "::warning::The Extremus SVG differs from the checked-in snapshot. Review the generated artifact and synchronize the snapshot before adding a blocking parity gate."
            git diff --stat -- docs/assets/extremus-crowd-bake.svg
          else
            echo "The Extremus SVG matches its checked-in snapshot."
          fi

      - name: Verify SVG formatting
        run: git diff --check -- docs/assets/gesture-*.svg docs/assets/speech-scene-population.svg docs/assets/crowd-response-schedule.svg docs/assets/extremus-crowd-bake.svg docs/assets/provider-actor-choice.svg docs/assets/provider-actor-choice.json

      - name: Test with coverage
        run: >
          dotnet test TheSingularityWorkshop.Gestures.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"

      - name: Prepare coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.Gestures
          files: ./TestResults/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Pack
        run: dotnet pack src/TheSingularityWorkshop.Gestures/TheSingularityWorkshop.Gestures.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: gestures-nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gestures-test-results
          path: ./TestResults/*

  publish_nuget:
    needs: build-and-test
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/development' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: gestures-nuget-package
          path: ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish package to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
