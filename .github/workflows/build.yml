name: Build, test, and package Gestures

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified package to NuGet.org"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.Gestures.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.Gestures.slnx --configuration Release --no-restore

      - name: Generate the living SVG from FSM_API and GestureEvaluator
        run: dotnet run --project tools/living-demo/living-demo.csproj --configuration Release --no-restore -- --output docs/assets/gesture-motion.svg

      - name: Generate deterministic variation scene
        run: dotnet run --project tools/variation-demo/variation-demo.csproj --configuration Release --no-restore -- --output docs/assets/gesture-variation.svg

      - name: Generate living crowd-response schedule from the CPU scheduler
        run: dotnet run --project tools/crowd-response-demo/crowd-response-demo.csproj --configuration Release --no-build -- --output docs/assets/crowd-response-schedule.svg

      - name: Validate documentation and generated SVG XML
        run: python -c "import xml.etree.ElementTree as ET; [ET.parse(p) for p in ['docs/assets/gesture-motion.svg', 'docs/assets/gesture-channels.svg', 'docs/assets/gesture-target-agnostic.svg', 'docs/assets/gesture-variation.svg', 'docs/assets/speech-scene-population.svg', 'docs/assets/crowd-response-schedule.svg']]"

      - name: Upload generated living SVGs
        uses: actions/upload-artifact@v7
        with:
          name: gesture-living-svgs
          path: docs/assets/gesture-*.svg

      - name: Report generated SVG snapshot drift
        shell: bash
        run: |
          if ! git diff --quiet -- docs/assets/gesture-motion.svg docs/assets/gesture-channels.svg docs/assets/gesture-target-agnostic.svg docs/assets/gesture-variation.svg docs/assets/crowd-response-schedule.svg; then
            echo "::warning::Generated living SVGs differ from checked-in snapshots. Review the uploaded gesture-living-svgs artifact and synchronize the snapshots before re-enabling the drift gate."
            git diff --stat -- docs/assets/gesture-motion.svg docs/assets/gesture-channels.svg docs/assets/gesture-target-agnostic.svg docs/assets/gesture-variation.svg docs/assets/crowd-response-schedule.svg
          else
            echo "All generated living SVG snapshots are current."
          fi

      - name: Verify SVG formatting
        run: git diff --check -- docs/assets/gesture-*.svg docs/assets/speech-scene-population.svg

      - name: Test with coverage
        run: >
          dotnet test TheSingularityWorkshop.Gestures.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"

      - name: Prepare coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.Gestures
          files: ./TestResults/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Pack
        run: dotnet pack src/TheSingularityWorkshop.Gestures/TheSingularityWorkshop.Gestures.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: gestures-nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gestures-test-results
          path: ./TestResults/*

  publish_nuget:
    needs: build-and-test
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/development' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: gestures-nuget-package
          path: ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish package to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
