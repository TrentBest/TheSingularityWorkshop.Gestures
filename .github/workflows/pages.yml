name: Publish Gestures living visuals to GitHub Pages (manual recovery)

on:
  # Normal development pushes deploy automatically after build-and-test succeeds in build.yml.
  # Keep this dispatch workflow as an explicit recovery path.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout development
        uses: actions/checkout@v7
        with:
          ref: development

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Generate evaluator-backed motion fixtures
        run: dotnet run --project tools/living-demo/living-demo.csproj --configuration Release -- --output docs/assets/gesture-motion.svg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload documentation and living visuals
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs


  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: TrentBest/TheSingularityWorkshop.CiAi/.github/workflows/deploy-pages.yml@5083c452b555d7645dd0c8ab01d76008026da436
